{% extends 'base.html' %}
{% load static %}

{% block title %}Passenger Login — Shriji Travels{% endblock %}

{% block content %}
<div class="container px-4 py-5">
  <div class="card border rounded-4 p-4 p-md-5 shadow-lg bg-white mx-auto" style="max-width: 460px;">
    <div class="text-center mb-4">
      <div class="fs-1 mb-2">👤</div>
      <h3 class="fw-bold text-navy mb-1">Passenger Login</h3>
      <p class="text-secondary small mb-0">Log in to book your seats, view tickets, and get special offers.</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next_url }}">

      <div class="mb-3">
        <label for="loginId" class="form-label small fw-bold text-secondary">Mobile Number or Email</label>
        <input type="text" name="login_id" id="loginId" class="form-control" placeholder="10-digit mobile or email address" required autofocus>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small fw-bold text-secondary">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold mb-3">
        Log In &amp; Continue →
      </button>

      <div class="text-center small text-secondary">
        Don't have a passenger account yet? 
        <a href="{% url 'passenger_register' %}?next={{ next_url }}" class="text-primary fw-bold text-decoration-none">
          Create Account
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
